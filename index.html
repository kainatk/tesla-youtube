<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tesla YouTube</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#08090b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#252a33 0,#0c0e12 42%,#060709 100%);color:#fff}
header{padding:24px 22px 14px;position:sticky;top:0;z-index:5;background:rgba(8,9,11,.82);backdrop-filter:blur(18px)}
.brand{font-size:25px;font-weight:750;letter-spacing:-.5px;margin-bottom:16px}.brand span{opacity:.5;font-weight:500}
.search{display:flex;gap:10px}.search input{min-width:0;flex:1;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;border-radius:16px;padding:16px;font-size:17px;outline:none}.search button,.back{border:0;border-radius:15px;padding:0 20px;background:#fff;color:#090a0c;font-weight:700;font-size:16px}
#status{padding:8px 22px;color:#8f96a3;font-size:13px}.chips{display:flex;gap:9px;padding:10px 22px;overflow:auto}.chip{white-space:nowrap;border:1px solid #333943;background:#171a20;color:#ddd;padding:10px 14px;border-radius:999px}
#results{padding:12px 22px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden;cursor:pointer;transition:.15s}.card:active{transform:scale(.98)}.thumb{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}.info{padding:14px}.title{font-size:16px;font-weight:700;line-height:1.3}.channel{margin-top:7px;color:#9ca3af;font-size:13px}
#playerWrap{display:none;padding:18px 22px 35px}.back{height:48px;margin-bottom:14px}.player{background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 18px 50px rgba(0,0,0,.45)}iframe{width:100%;height:100%;border:0}.now{font-size:18px;font-weight:650;margin-top:15px}
@media(max-width:650px){header{padding:18px 16px 12px}.chips,#status,#results,#playerWrap{padding-left:16px;padding-right:16px}#results{grid-template-columns:1fr}.search button{padding:0 16px}}
</style>
</head>
<body>
<header><div class="brand">▶ Tesla <span>YouTube</span></div>
<form class="search" id="form"><input id="q" placeholder="Search YouTube…" autocomplete="off"><button>Search</button></form></header>
<div class="chips"><button class="chip" onclick="quick('music')">Music</button><button class="chip" onclick="quick('podcasts')">Podcasts</button><button class="chip" onclick="quick('comedy')">Comedy</button><button class="chip" onclick="quick('gaming')">Gaming</button><button class="chip" onclick="quick('news')">News</button></div>
<div id="status">Enter your YouTube API key when prompted.</div>
<div id="playerWrap"><button class="back" onclick="closePlayer()">← Back</button><div class="player"><iframe id="player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><div class="now" id="now"></div></div>
<div id="results"></div>
<script>
let key=localStorage.getItem("ytkey")||"";
function getKey(){if(!key){key=prompt("Paste your YouTube Data API v3 key");if(!key)return false;key=key.trim();localStorage.setItem("ytkey",key)}return true}
function quick(q){document.getElementById("q").value=q;search(q)}
async function search(q){if(!getKey())return;status.textContent="Searching…";let u=new URL("https://www.googleapis.com/youtube/v3/search");u.searchParams.set("part","snippet");u.searchParams.set("q",q);u.searchParams.set("type","video");u.searchParams.set("maxResults","18");u.searchParams.set("videoEmbeddable","true");u.searchParams.set("videoSyndicated","true");u.searchParams.set("key",key);try{let r=await fetch(u),d=await r.json();if(!r.ok)throw Error(d.error?.message||"Search failed");render(d.items||[]);status.textContent=`${d.items?.length||0} results`}catch(e){status.textContent=e.message;localStorage.removeItem("ytkey");key=""}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(a){results.innerHTML=a.map(x=>`<article class="card" onclick="play('${x.id.videoId}',this.dataset.t)" data-t="${esc(x.snippet.title)}"><img class="thumb" src="https://i.ytimg.com/vi/${x.id.videoId}/hqdefault.jpg"><div class="info"><div class="title">${esc(x.snippet.title)}</div><div class="channel">${esc(x.snippet.channelTitle)}</div></div></article>`).join("")}
function play(id,title){results.style.display="none";playerWrap.style.display="block";player.src=`https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0`;now.textContent=title}
function closePlayer(){player.src="";playerWrap.style.display="none";results.style.display="grid"}
form.onsubmit=e=>{e.preventDefault();let q=document.getElementById("q").value.trim();if(q)search(q)}
</script>
</body></html>
